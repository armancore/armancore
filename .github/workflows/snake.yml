name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c8102e&color_dots=#efece4,#c9d2e6,#8fa4d8,#4f73c8,#1f4fbf
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4d6a&color_dots=#161f36,#1f3263,#2f4fa3,#4f73e0,#8aa6ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
